<script>
async function playSelectedAnnouncement(button) {
    const picker = button.closest(".announcement-picker");
    const audio = picker.querySelector("audio");
    const status = picker.querySelector('[role="status"]');
    const url = `${picker.querySelector("select").value}?v=${Date.now()}`;
    status.textContent = "";
    audio.hidden = true;
    audio.pause();
    try {
        const response = await fetch(url, {method: "HEAD"});
        if (!response.ok) {
            throw new Error(response.status === 404 ? "File missing" : "Could not access audio file");
        }
        audio.src = url;
        audio.hidden = false;
        await audio.play();
    } catch (error) {
        status.textContent = error.message || "Could not play audio";
    }
}
</script>
